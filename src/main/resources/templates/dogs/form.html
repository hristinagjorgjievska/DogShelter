<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${dogId == null} ? 'Add dog' : 'Edit dog', ~{::section})}">
<body>
<section>
    <div class="page-header">
        <div>
            <h1 th:text="${dogId == null} ? 'Add dog' : 'Edit dog'">Add dog</h1>
            <p class="subtitle">Dogs marked as available can receive adoption requests.</p>
        </div>
    </div>

    <form class="card form" th:object="${form}" method="post"
          th:action="${dogId == null} ? @{/dogs} : @{/dogs/{id}(id=${dogId})}">

        <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}" placeholder="e.g. Luna">
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="row">
            <div class="field" th:classappend="${#fields.hasErrors('breed')} ? 'has-error'">
                <label for="breed">Breed</label>
                <select id="breed" th:field="*{breed}">
                    <option value="">Select a breed</option>
                    <option th:each="b : ${breeds}" th:value="${b}"
                            th:text="|${b.displayName} (${b.typicalSize.label})|">Beagle (Medium)</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('breed')}" th:errors="*{breed}"></div>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('sex')} ? 'has-error'">
                <label for="sex">Sex</label>
                <select id="sex" th:field="*{sex}">
                    <option value="">Select</option>
                    <option th:each="s : ${sexes}" th:value="${s}" th:text="${s.displayName}">Male</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('sex')}" th:errors="*{sex}"></div>
            </div>
        </div>

        <div class="row">
            <div class="field" th:classappend="${#fields.hasErrors('birthDate')} ? 'has-error'">
                <label for="birthDate">Birth date</label>
                <input id="birthDate" type="date" th:field="*{birthDate}">
                <div class="error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('weightKg')} ? 'has-error'">
                <label for="weightKg">Weight (kg)</label>
                <input id="weightKg" type="number" step="0.1" min="0" th:field="*{weightKg}">
                <div class="error" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></div>
            </div>
        </div>

        <div class="row">
            <div class="field" th:classappend="${#fields.hasErrors('status')} ? 'has-error'">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}">Available</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('shelterId')} ? 'has-error'">
                <label for="shelterId">Shelter</label>
                <select id="shelterId" th:field="*{shelterId}">
                    <option value="">Select a shelter</option>
                    <option th:each="sh : ${shelters}" th:value="${sh.id}"
                            th:text="|${sh.name} — ${sh.city}|">Shelter</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('shelterId')}" th:errors="*{shelterId}"></div>
            </div>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}"
                      placeholder="Temperament, health notes, what kind of home suits this dog"></textarea>
            <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="form-actions">
            <button class="btn" type="submit" th:text="${dogId == null} ? 'Add dog' : 'Save changes'">Save</button>
            <a class="btn btn-secondary" th:href="@{/dogs}">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
