spring.application.name=dog-shelter
server.port=${SERVER_PORT:8080}
server.servlet.session.tracking-modes=cookie

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dogshelter}
spring.datasource.username=${DB_USER:dogshelter}
spring.datasource.password=${DB_PASSWORD:dogshelter}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

shelter.seed-data=${SEED_DATA:true}
